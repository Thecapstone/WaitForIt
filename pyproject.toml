
[project]
name = "wait-for-it"
version = "0.1.0"
description = "Visibility for backend developers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asgiref==3.11.1",
    "attrs==26.1.0",
    "celery[redis]>=5.3.1",
    "certifi==2026.2.25",
    "cffi==2.0.0",
    "charset-normalizer==3.4.6",
    "cloudinary>=1.45.0",
    "cryptography==48.0.1",
    "defusedxml==0.7.1",
    "django==6.0.7",
    "django-allauth==65.15.0",
    "django-auto-prefetch==1.14.0",
    "django-cors-headers==4.9.0",
    "django-environ>=0.14.0",
    "django-extensions==4.1",
    "django-ipware>=7.0.1",
    "django-widget-tweaks==1.5.1",
    "djangorestframework==3.17.0",
    "djangorestframework-simplejwt==5.5.1",
    "djoser==2.3.3",
    "drf-spectacular==0.29.0",
    "drf-spectacular-sidecar==2026.3.1",
    "gunicorn==25.2.0",
    "httpx>=0.28.1",
    "idna==3.15",
    "inflection==0.5.1",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "moviepy>=1.0.3",
    "oauthlib==3.3.1",
    "packaging==26.0",
    "pillow==12.3.0",
    "pre-commit>=4.6.0",
    "psycopg2-binary>=2.9.12",
    "pycparser==3.0",
    "pyjwt==2.13.0",
    "python-dotenv>=1.2.2",
    "python3-openid==3.2.0",
    "pyyaml==6.0.3",
    "redis>=8.0.1",
    "referencing==0.37.0",
    "requests==2.33.0",
    "requests-oauthlib==2.0.0",
    "rpds-py==0.30.0",
    "ruff>=0.15.22",
    "social-auth-app-django==5.7.0",
    "social-auth-core==4.8.5",
    "sqlparse==0.5.5",
    "tzdata==2025.3",
    "uritemplate==4.2.0",
    "urllib3==2.7.0",
    "user-agents>=2.2.0",
    "whitenoise==6.12.0",
]


[tool.ruff]
# Target Python version
target-version = "py312"
fix = true
unsafe-fixes = true

[tool.ruff.lint]
# Core rules for a robust FastAPI project
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (auto-sorts imports)
    "B",    # flake8-bugbear (catches common bugs)
    "UP",   # pyupgrade (forces modern Python syntax)
    "RUF",  # Ruff-specific rules (includes Pydantic typing & mutable defaults checks)
]

ignore = [
    "RUF012",
    "E501"
]

[tool.ruff.lint.isort]
# Combines multiple imports from the same module onto a single line
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
preview = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
# Automatically append coverage parameters whenever "uv run pytest" is executed
addopts = "--cov=. --cov-report=term-missing --cov-report=html"
pythonpath = ["."]

python_files = [
    "test_*.py",
]

[tool.ruff.lint.per-file-ignores]
"**/serializers.py" = ["RUF012"]
"**/views.py" = ["RUF012"]
"**/models.py" = ["RUF012"]
"**/migrations/*.py" = ["E501"]

[tool.coverage.report]
# Fail the test suite if total coverage drops under a specific threshold (e.g., 80%)
fail_under = 80
