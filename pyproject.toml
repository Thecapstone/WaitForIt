
[project]
name = "wait-for-it"
version = "0.1.0"
description = "Visibility for backend developers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asgiref==3.11.1",
    "attrs==26.1.0",
    "certifi==2026.2.25",
    "cffi==2.0.0",
    "charset-normalizer==3.4.6",
    "cloudinary>=1.45.0",
    "cryptography==46.0.5",
    "defusedxml==0.7.1",
    "django==6.0.3",
    "django-allauth==65.15.0",
    "django-auto-prefetch==1.14.0",
    "django-cors-headers==4.9.0",
    "django-environ>=0.14.0",
    "django-extensions==4.1",
    "django-ipware>=7.0.1",
    "django-rest-framework==0.1.0",
    "django-widget-tweaks==1.5.1",
    "djangorestframework==3.17.0",
    "djangorestframework-simplejwt==5.5.1",
    "djoser==2.3.3",
    "drf-spectacular==0.29.0",
    "drf-spectacular-sidecar==2026.3.1",
    "gunicorn==25.2.0",
    "idna==3.11",
    "inflection==0.5.1",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "moviepy>=1.0.3",
    "oauthlib==3.3.1",
    "packaging==26.0",
    "pillow==12.1.1",
    "pycparser==3.0",
    "pyjwt==2.12.1",
    "python3-openid==3.2.0",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "requests==2.32.5",
    "requests-oauthlib==2.0.0",
    "rpds-py==0.30.0",
    "social-auth-app-django==5.7.0",
    "social-auth-core==4.8.5",
    "sqlparse==0.5.5",
    "tzdata==2025.3",
    "uritemplate==4.2.0",
    "urllib3==2.6.3",
    "user-agents>=2.2.0",
    "whitenoise==6.12.0",
]


[tool.ruff]
line-length = 120
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*/migrations/*",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
