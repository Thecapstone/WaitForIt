openapi: 3.0.3
info:
  title: Wait-For-It API
  version: 1.0.0
  description: API documentation for Wait-For-It
paths:
  /api/auth/{id}/create-admin/:
    post:
      operationId: auth_create_admin_create
      description: Create additional admin accounts.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreate'
          description: ''
  /api/auth/create-super-admin/:
    post:
      operationId: auth_create_super_admin_create
      description: Create an initial admin account.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreate'
          description: ''
  /api/auth/create-tester/:
    post:
      operationId: auth_create_tester_create
      description: Create a test user account for development and testing purposes.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLogin'
          description: ''
  /api/auth/forgot-password/:
    post:
      operationId: auth_forgot_password_create
      description: User authentication endpoint handling cookies and session tracking.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticate user credentials and set secure HTTP-only cookies.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreate'
          description: ''
  /api/auth/logout/:
    get:
      operationId: auth_logout_retrieve
      description: Blacklist refresh token and nullify active user session database
        tracks.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreate'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Register a new user account in the system.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          description: Registration successful.
  /api/auth/reset-password/:
    post:
      operationId: auth_reset_password_create
      description: Reset a user's password using a valid password reset token.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordReset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordReset'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
        '400':
          description: No response body
  /api/auth/verify-reset/{token}/:
    get:
      operationId: auth_verify_reset_retrieve
      description: User authentication endpoint handling cookies and session tracking.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreate'
          description: ''
  /api/auth/verify/{token}/:
    get:
      operationId: auth_verify_retrieve
      description: Verify a user's email address.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreate'
          description: ''
  /api/memories/:
    get:
      operationId: memories_list
      tags:
      - memories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CapsuleCreation'
          description: ''
    post:
      operationId: memories_create
      tags:
      - memories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapsuleCreation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CapsuleCreation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CapsuleCreation'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapsuleCreation'
          description: ''
  /api/memories/{id}/:
    get:
      operationId: memories_retrieve
      description: View all capsule content, by members, once the open date reaches.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          description: unique id generator for anonymous usernames
        required: true
      tags:
      - memories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapsuleCreation'
          description: ''
    put:
      operationId: memories_update
      description: Update capsule data by contributors or creator not members.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          description: unique id generator for anonymous usernames
        required: true
      tags:
      - memories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapsuleCreation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CapsuleCreation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CapsuleCreation'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapsuleCreation'
          description: ''
    patch:
      operationId: memories_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          description: unique id generator for anonymous usernames
        required: true
      tags:
      - memories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCapsuleCreation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCapsuleCreation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCapsuleCreation'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapsuleCreation'
          description: ''
    delete:
      operationId: memories_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          description: unique id generator for anonymous usernames
        required: true
      tags:
      - memories
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/memories/{id}/create-log/:
    get:
      operationId: memories_create_log_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          description: unique id generator for anonymous usernames
        required: true
      tags:
      - memories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapsuleCreation'
          description: ''
  /api/memories/{id}/log/:
    get:
      operationId: memories_log_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          description: unique id generator for anonymous usernames
        required: true
      tags:
      - memories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapsuleCreation'
          description: ''
  /api/token/:
    post:
      operationId: token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/refresh:
    post:
      operationId: token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/token/verify/:
    post:
      operationId: token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerify'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerify'
          description: ''
components:
  schemas:
    CapsuleCreation:
      type: object
      properties:
        title:
          type: string
          maxLength: 224
        description:
          type: string
          nullable: true
          maxLength: 220
        maturity_date:
          type: string
          format: date-time
          description: Time to open capsule
        private:
          type: boolean
          default: true
          description: Restrict other users from view this profile
      required:
      - title
    ForgotPassword:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    PasswordReset:
      type: object
      properties:
        token:
          type: string
        password:
          type: string
          writeOnly: true
        confirm_password:
          type: string
          writeOnly: true
      required:
      - confirm_password
      - password
      - token
    PatchedCapsuleCreation:
      type: object
      properties:
        title:
          type: string
          maxLength: 224
        description:
          type: string
          nullable: true
          maxLength: 220
        maturity_date:
          type: string
          format: date-time
          description: Time to open capsule
        private:
          type: boolean
          default: true
          description: Restrict other users from view this profile
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    TokenVerify:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
      required:
      - token
    UserCreate:
      type: object
      description: Custom user creation serializer, validates input and hashes user
        password.
      properties:
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    UserLogin:
      type: object
      description: User login serializer, validates user active status.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
