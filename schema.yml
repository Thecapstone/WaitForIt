openapi: 3.0.3
info:
  title: Wait-For-It API
  version: 1.0.0
  description: API documentation for Wait-For-It
paths:
  /api/auth/{id}/create-admin/:
    post:
      operationId: auth_create_admin_create
      description: Create additional admin accounts.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdmin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateAdmin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAdmin'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAdmin'
          description: ''
  /api/auth/{id}/create-tester/:
    post:
      operationId: auth_create_tester_create
      description: Create a test user account for development and testing purposes.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLogin'
          description: ''
  /api/auth/create-super-admin/:
    post:
      operationId: auth_create_super_admin_create
      description: Create an initial admin account.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdmin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateAdmin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAdmin'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAdmin'
          description: ''
  /api/auth/forgot-password/:
    post:
      operationId: auth_forgot_password_create
      description: User authentication endpoint handling cookies and session tracking.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticate user credentials and set secure HTTP-only cookies.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserLogin'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLogin'
          description: ''
  /api/auth/logout/:
    get:
      operationId: auth_logout_retrieve
      description: Blacklist refresh token and nullify active user session database
        tracks.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreate'
          description: ''
  /api/auth/password-reset/{token}/:
    post:
      operationId: auth_password_reset_create
      description: Reset a user's password using a valid password reset token.
      parameters:
      - in: path
        name: token
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordReset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordReset'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
        '400':
          description: No response body
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Register a new user account in the system.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          description: Register custom user.
  /api/auth/verify/{token}/:
    get:
      operationId: auth_verify_retrieve
      description: Verify a user's email address.
      parameters:
      - in: path
        name: token
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreate'
          description: ''
  /api/memories/:
    get:
      operationId: memories_list
      tags:
      - memories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CapsuleCreation'
          description: ''
    post:
      operationId: memories_create
      tags:
      - memories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapsuleCreation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CapsuleCreation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CapsuleCreation'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapsuleCreation'
          description: ''
  /api/memories/{id}/:
    get:
      operationId: memories_retrieve
      description: View all capsule content, by members, once the open date reaches.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          description: unique id generator for anonymous usernames
        required: true
      tags:
      - memories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapsuleCreation'
          description: ''
    put:
      operationId: memories_update
      description: Update capsule data by contributors or creator not members.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          description: unique id generator for anonymous usernames
        required: true
      tags:
      - memories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapsuleCreation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CapsuleCreation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CapsuleCreation'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapsuleCreation'
          description: ''
    patch:
      operationId: memories_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          description: unique id generator for anonymous usernames
        required: true
      tags:
      - memories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCapsuleCreation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCapsuleCreation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCapsuleCreation'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapsuleCreation'
          description: ''
    delete:
      operationId: memories_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          description: unique id generator for anonymous usernames
        required: true
      tags:
      - memories
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/memories/{id}/audit-logs/:
    get:
      operationId: memories_audit_logs_list
      description: Read a capsule's audit trail. Only the creator or contributors
        may view it.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          description: unique id generator for anonymous usernames
        required: true
      tags:
      - memories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CapsuleAuditLog'
          description: ''
  /api/memories/{id}/create-log/:
    post:
      operationId: memories_create_log_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          description: unique id generator for anonymous usernames
        required: true
      tags:
      - memories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapsuleCreation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CapsuleCreation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CapsuleCreation'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapsuleCreation'
          description: ''
  /api/memories/{id}/log/:
    get:
      operationId: memories_log_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          description: unique id generator for anonymous usernames
        required: true
      tags:
      - memories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapsuleCreation'
          description: ''
  /api/token/:
    post:
      operationId: token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/refresh:
    post:
      operationId: token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/token/verify/:
    post:
      operationId: token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerify'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerify'
          description: ''
components:
  schemas:
    ActionEnum:
      enum:
      - CREATED
      - VIEWED
      - UPDATED
      - LOG_ADDED
      - ARTICLE_GENERATED
      - MEMBER_ADDED
      - MEMBER_REMOVED
      - CONTRIBUTOR_ADDED
      - CONTRIBUTOR_REMOVED
      type: string
      description: |-
        * `CREATED` - Capsule created
        * `VIEWED` - Capsule viewed
        * `UPDATED` - Capsule updated
        * `LOG_ADDED` - Log added to capsule
        * `ARTICLE_GENERATED` - Article generated for capsule
        * `MEMBER_ADDED` - Member added to capsule
        * `MEMBER_REMOVED` - Member removed from capsule
        * `CONTRIBUTOR_ADDED` - Contributor added to capsule
        * `CONTRIBUTOR_REMOVED` - Contributor removed from capsule
    CapsuleAuditLog:
      type: object
      properties:
        id:
          type: string
          readOnly: true
          description: unique id generator for anonymous usernames
        action:
          $ref: '#/components/schemas/ActionEnum'
        entity_type:
          $ref: '#/components/schemas/EntityTypeEnum'
        entity_id:
          type: string
          maxLength: 120
        actor:
          type: string
          readOnly: true
          nullable: true
        metadata: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - created_at
      - entity_id
      - entity_type
      - id
    CapsuleCreation:
      type: object
      properties:
        title:
          type: string
          maxLength: 224
        description:
          type: string
          nullable: true
          maxLength: 220
        previous_article:
          type: string
        maturity_date:
          type: string
          format: date-time
          description: Time to open capsule
        private:
          type: boolean
          default: true
          description: Restrict other users from view this profile
      required:
      - title
    CreateAdmin:
      type: object
      description: Custom user creation serializer, validates input and hashes user
        password.
      properties:
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    EntityTypeEnum:
      enum:
      - capsule
      - log
      - article
      - user
      type: string
      description: |-
        * `capsule` - Capsule
        * `log` - Log
        * `article` - Article
        * `user` - User
    ForgotPassword:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    PasswordReset:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
        confirm_password:
          type: string
          writeOnly: true
      required:
      - confirm_password
      - password
    PatchedCapsuleCreation:
      type: object
      properties:
        title:
          type: string
          maxLength: 224
        description:
          type: string
          nullable: true
          maxLength: 220
        previous_article:
          type: string
        maturity_date:
          type: string
          format: date-time
          description: Time to open capsule
        private:
          type: boolean
          default: true
          description: Restrict other users from view this profile
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    TokenVerify:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
      required:
      - token
    UserCreate:
      type: object
      description: Custom user creation serializer, validates input and hashes user
        password.
      properties:
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    UserLogin:
      type: object
      description: User login serializer, validates user active status.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
